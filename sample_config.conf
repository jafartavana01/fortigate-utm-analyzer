# FortiGate Sample Config — FOR TESTING/DEMO ONLY
# Intentionally misconfigured to demonstrate all audit checks
# DO NOT deploy this config on any real device

config system global
    set hostname FortiGate
    set admintimeout 480
    set strong-crypto disable
    set ssl-static-key-ciphers enable
    set dh-params 1024
    set admin-lockout-threshold 0
    set admin-lockout-duration 0
    set pre-login-banner disable
    set post-login-banner disable
    set admin-https-redirect disable
    set admin-server-cert "self-sign"
    set admin-password-policy disable
    set revision-image-auto-backup disable
end

config system admin
    edit "admin"
        set accprofile "super_admin"
        set two-factor disable
        set force-password-change disable
        set admintimeout 0
    next
    edit "readonly-user"
        set accprofile "prof_admin"
        set two-factor disable
        set trusthost1 0.0.0.0 0.0.0.0
    next
end

config system interface
    edit "wan1"
        set ip 203.0.113.1 255.255.255.0
        set allowaccess ping https ssh http telnet snmp
        set role wan
    next
    edit "port1"
        set ip 192.168.1.1 255.255.255.0
        set allowaccess ping https
        set role lan
    next
    edit "dmz"
        set ip 10.10.10.1 255.255.255.0
        set allowaccess http telnet
        set role dmz
    next
end

config system ntp
    set ntpsync enable
    set type custom
    set authentication disable
    config ntpserver
        edit 1
            set server "pool.ntp.org"
        next
    end
end

config system ha
    set mode a-p
    set hb-encryption disable
    set sync-config disable
end

config firewall policy
    edit 1
        set name "LAN_to_Internet"
        set srcintf "port1"
        set dstintf "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set nat enable
        set logtraffic disable
        set capture-packet enable
    next
    edit 2
        set name "Internet_to_DMZ"
        set srcintf "wan1"
        set dstintf "dmz"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic utm
    next
    edit 3
        set name "Management_Access"
        set srcintf "wan1"
        set dstintf "port1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic disable
        set status disable
    next
end

config firewall ssl-ssh-profile
    edit "demo-ssl-profile"
        set inspection-method certificate-inspection
        set sni-check disable
        set untrusted-cert allow
        set expired-cert allow
        set invalid-cert allow
        set revoked-server-cert allow
        set log-ssl-anomalies disable
        set block-blacklisted-certificates disable
    next
    edit "deep-inspect-no-ca"
        set inspection-method deep-inspection
        set untrusted-cert allow
        set invalid-cert allow
        set log-ssl-anomalies disable
    next
end

config antivirus profile
    edit "demo-av-profile"
        set feature-set flow
    next
end

config ips sensor
    edit "default-ips"
        set block-malicious-url disable
        set scan-botnet-connections monitor
        set extended-db disable
    next
end

config webfilter profile
    edit "default-wf"
        set log-all-url disable
        set safe-search disable
        set override enable
        set web-content-log disable
    next
end

config application list
    edit "default-app"
        set log disable
        set unknown-application-action pass
    next
end

config dnsfilter profile
    edit "default-dns"
        set block-botnet disable
        set log-all-domain disable
        set safe-search disable
        set ftgd-dns disable
    next
end

config vpn ipsec phase1-interface
    edit "vpn-to-branch"
        set ike-version 1
        set mode aggressive
        set authmethod psk
        set psksecret "weak123"
        set proposal 3des-md5
        set dhgrp 1 2
        set dpd disable
        set rekey disable
        set keylifetime 172800
    next
end

config vpn ipsec phase2-interface
    edit "vpn-to-branch-p2"
        set phase1name "vpn-to-branch"
        set proposal 3des-md5
        set pfs disable
        set keylifetime-seconds 172800
    next
end

config vpn ssl settings
    set status enable
    set port 443
    set servercert "self-sign"
    set tlsv1-0 enable
    set login-attempt-limit 0
    set login-block-time 10
    set idle-timeout 0
    set auth-timeout 86400
    set source-address "all"
end

config vpn ssl web portal
    edit "full-access"
        set split-tunneling enable
        set ftp-proxy enable
        set smb-proxy enable
    next
end

config log fortianalyzer setting
    set status disable
end

config log syslogd setting
    set status enable
    set server "192.168.1.200"
    set mode udp
    set enc-algorithm disable
end

config log setting
    set log-invalid-packet disable
    set resolve-ip disable
end

config firewall local-in-policy
    edit 1
        set intf ""
        set srcaddr "all"
        set dstaddr "all"
        set service "ALL"
        set action accept
        set schedule "always"
    next
end
