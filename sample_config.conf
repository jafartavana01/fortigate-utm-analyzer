# FortiGate Sample Config - FOR TESTING ONLY
# This is a minimal synthetic config for demonstration purposes

config system global
    set hostname FGT-DEMO-01
    set admintimeout 480
    set strong-crypto disable
    set ssl-static-key-ciphers enable
    set dh-params 2048
    set admin-lockout-threshold 0
    set admin-lockout-duration 0
end

config system admin
    edit "admin"
        set accprofile "super_admin"
        set two-factor disable
    next
end

config system interface
    edit "wan1"
        set ip 203.0.113.1 255.255.255.0
        set allowaccess ping https ssh http
        set role wan
    next
    edit "port1"
        set ip 192.168.1.1 255.255.255.0
        set allowaccess ping https
        set role lan
    next
end

config system ntp
    set ntpsync enable
    set type custom
    config ntpserver
        edit 1
            set server "pool.ntp.org"
        next
    end
end

config firewall policy
    edit 1
        set name "LAN_to_Internet"
        set srcintf "port1"
        set dstintf "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set nat enable
        set logtraffic disable
    next
end

config firewall ssl-ssh-profile
    edit "demo-ssl-profile"
        set inspection-method certificate-inspection
        set sni-check disable
        set untrusted-cert allow
        set expired-cert allow
        set invalid-cert allow
        set log-ssl-anomalies disable
    next
end

config antivirus profile
    edit "demo-av-profile"
        set feature-set flow
    next
end

config firewall local-in-policy
    edit 1
        set intf ""
        set srcaddr "all"
        set dstaddr "all"
        set service "ALL"
        set action accept
        set schedule "always"
    next
end
